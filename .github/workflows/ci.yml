name: CI
on:
  release:
    types: [published]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js (cache npm)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restaurer le cache de build Next.js
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.css', '!frontend/node_modules/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les tests d'intégration ont besoin d'un vrai Postgres (Flyway, contraintes SQL).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stock_test
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_user -d stock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21 (cache Maven)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Lancer les tests et packager
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/stock_test
          TEST_DB_USER: stock_user
          TEST_DB_PASS: stock_ci_pass
        run: ./mvnw -B verify

      - name: Conserver les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  # Images versionnées poussées dans le registry privé GitHub Container Registry (ghcr.io).
  # Le tag de l'image est exactement celui de la release (ex. v2.1.0) : traçable et immuable.
  build-push:
    name: build-push (${{ matrix.service }})
    needs: [test-frontend, test-backend]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # pousser dans ghcr.io avec le GITHUB_TOKEN, sans secret à gérer
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            # Le rewrite /api/v1/* de Next est figé au build.
            build-args: |
              BACKEND_INTERNAL_URL=http://backend-service:8080
          - service: backend
            build-args: ''
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      # Les noms d'images Docker doivent être en minuscules (le propriétaire est "EJisAwaken").
      - name: Nom de l'image
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stock-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max

  # Déploiement : runner auto-hébergé sur k8s-master (le cluster est sur un LAN privé, injoignable
  # depuis les runners GitHub ; c'est le runner qui ouvre une connexion sortante vers GitHub).
  # Il agit avec le compte Kubernetes ci-deployer, limité au namespace prod (cicd/ci-deployer-rbac.yml).
  deploy:
    needs: build-push
    if: github.event_name == 'release'
    runs-on: [self-hosted, k8s-deploy]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-prod          # jamais deux déploiements en même temps
      cancel-in-progress: false
    env:
      KUBECONFIG: /home/josefa/.kube/ci-deployer.config
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Récupérer le code (chart versionné)
        uses: actions/checkout@v7

      - name: Déployer avec Helm
        # --rollback-on-failure : si les Pods ne deviennent pas prêts, Helm revient tout seul
        # à la dernière révision saine et le job échoue.
        run: |
          helm upgrade application ./k8s-m1/helm/application -n prod \
            --set frontend.image.tag="$TAG" \
            --set backend.image.tag="$TAG" \
            --rollback-on-failure --timeout 10m

      - name: Tester le déploiement
        run: helm test application -n prod --logs

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Déploiement $TAG"
            echo '```'
            helm history application -n prod --max 3
            kubectl -n prod get deploy -o custom-columns=DEPLOYMENT:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,PRETS:.status.readyReplicas
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
