{{- if .Values.rbac.developer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  labels:
    {{- include "application.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-service-reader
  labels:
    {{- include "application.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-pod-service-reader
  labels:
    {{- include "application.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-service-reader
{{- end }}
