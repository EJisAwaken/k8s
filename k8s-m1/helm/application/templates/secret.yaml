apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    # Ne jamais supprimer le Secret au "helm uninstall" : la base en dépend.
    helm.sh/resource-policy: keep
type: Opaque
data:
  DB_USER: {{ .Values.secret.dbUser | b64enc | quote }}
  DB_PASSWORD: {{ include "application.secretValue" (list $ "DB_PASSWORD" .Values.secret.dbPassword 24) | b64enc | quote }}
  API_TOKEN: {{ include "application.secretValue" (list $ "API_TOKEN" .Values.secret.apiToken 64) | b64enc | quote }}
  DB_BACKUP_PASSWORD: {{ include "application.secretValue" (list $ "DB_BACKUP_PASSWORD" .Values.secret.backupPassword 32) | b64enc | quote }}
