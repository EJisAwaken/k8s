{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: db-backup
            db-access: "true"
        spec:
          restartPolicy: OnFailure
          {{- include "application.tolerations" . | nindent 10 }}
          containers:
            - name: pg-dump
              image: {{ .Values.database.image }}
              env:
                - name: PGHOST
                  value: database
                - name: PGUSER
                  value: stock_backup
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: app-secret, key: DB_BACKUP_PASSWORD } }
                - name: PGDATABASE
                  valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME } }
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              command:
                - sh
                - -c
                - |
                  set -e
                  f="/backups/${PGDATABASE}-$(date +%Y%m%d-%H%M%S).dump"
                  trap 'rm -f "$f.tmp"' EXIT
                  for i in $(seq 1 30); do pg_isready -q && break; sleep 2; done
                  pg_isready
                  pg_dump -Fc --no-owner --no-privileges -f "$f.tmp"
                  mv "$f.tmp" "$f"
                  echo "Sauvegarde OK : $f ($(du -h "$f" | cut -f1))"
                  find /backups -name '*.dump' -mtime +"$RETENTION_DAYS" -print -delete
                  find /backups -name '*.tmp' -print -delete
                  echo "Sauvegardes présentes :"; ls -lh /backups
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim }}
{{- end }}
