apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    {{- include "application.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_NAME: {{ .Values.config.appName | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  API_URL: {{ printf "http://%s:%v" .Values.backend.serviceName .Values.backend.port | quote }}
  SERVER_PORT: {{ .Values.backend.port | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_URL: {{ printf "jdbc:postgresql://database:5432/%s" .Values.config.dbName | quote }}
  APP_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  APP_COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
