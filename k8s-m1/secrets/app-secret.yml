# Données sensibles (TP 8.4). EXEMPLE UNIQUEMENT : le dépôt est public, aucune vraie valeur ici.
# En production, le Secret app-secret est géré par le chart Helm (helm/application/templates/secret.yaml) :
# les valeurs existantes sont conservées, ou générées aléatoirement à la première installation.
#
# Un Secret n'est qu'encodé en base64, pas chiffré : sa protection repose sur le RBAC
# (le compte developer ne peut pas le lire) et, en production, sur le chiffrement d'etcd
# (EncryptionConfiguration) et un outil comme Sealed Secrets ou SOPS pour le versionner.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: prod
type: Opaque
stringData:
  DB_USER: stockuser
  DB_PASSWORD: "a-remplacer"
  # Clé de signature des JWT du backend (APP_JWT_SECRET). Générer avec : openssl rand -hex 32
  API_TOKEN: "a-remplacer-openssl-rand-hex-32"
  # Mot de passe du rôle PostgreSQL stock_backup (lecture seule), créé par jobs/db-init.yml
  DB_BACKUP_PASSWORD: "a-remplacer"
