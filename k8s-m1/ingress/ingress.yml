# Routage par nom d'hôte. Sur le poste client, ajouter dans /etc/hosts :
#   192.168.10.11  app.k8s.local api.k8s.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
    - host: app.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
