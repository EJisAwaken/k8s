apiVersion: apps/v1
kind: Deployment

metadata: 
  name: database-deployment

spec: 
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec: 
      containers:
        - name: database-stock
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: database-secret
