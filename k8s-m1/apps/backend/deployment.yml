apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec: 
  replicas: 3
  selector: 
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
       - name: backend-stock
         image: josefa613/stock_backend_prod:latest
         ports:
           - containerPort: 8080
         envFrom:
           - secretRef:
               name: backend-secret

