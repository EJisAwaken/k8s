apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 2m"

spec: 
  replicas: 3
  selector: 
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
       - name: backend-stock
         image: josefa613/stock_backend_prod:latest
         imagePullPolicy: Always
         ports:
           - containerPort: 8080
         envFrom:
           - secretRef:
               name: backend-secret

